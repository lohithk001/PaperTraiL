packages:
  - 'apps/*'
  - 'packages/*'

trustLockfile: true

allowBuilds:
  '@clerk/shared': true
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - '@expo/schema-utils@58.0.3'
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo@58.0.22
